name: AI Website Guardian

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-website-guardian
  cancel-in-progress: false

jobs:
  audit-and-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install temporary browser audit dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build current website
        id: initial_build
        continue-on-error: true
        run: |
          npm run build
          npm run typecheck

      - name: Audit production website
        id: audit
        env:
          AI_GUARDIAN_BASE_URL: https://homemade-beauty-care.vercel.app
          AI_GUARDIAN_BUILD_STATUS: ${{ steps.initial_build.outcome }}
        run: node scripts/ai-guardian-audit.mjs

      - name: Run safe checkout smoke tests
        id: checkout_test
        if: steps.audit.outcome == 'success'
        env:
          AI_GUARDIAN_BASE_URL: https://homemade-beauty-care.vercel.app
        run: node scripts/ai-guardian-checkout-test.mjs

      - name: Ask Gemini for a guarded code fix
        id: ai_fix
        if: always() && steps.audit.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
          AI_GUARDIAN_AUTO_FIX: ${{ vars.AI_GUARDIAN_AUTO_FIX || 'true' }}
        run: node scripts/ai-guardian-ai-fix.mjs

      - name: Validate AI-generated changes
        id: validate
        if: steps.ai_fix.outputs.changed == 'true'
        run: |
          git diff --check
          npm run build
          npm run typecheck
          AI_GUARDIAN_OUTPUT=ai-guardian-postfix.json node scripts/ai-guardian-audit.mjs

      - name: Compare before and after audit
        id: compare
        if: steps.validate.outcome == 'success'
        run: node scripts/ai-guardian-compare.mjs

      - name: Create a reviewable AI fix pull request
        id: create_pr
        if: steps.compare.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="ai-guardian/fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/HomePage.tsx src/pages/ProductDetailPage.tsx src/pages/ShopPage.tsx src/pages/HairPackLandingPage.tsx src/components/ProductCard.tsx src/components/Header.tsx src/components/Footer.tsx
          if git diff --cached --quiet; then
            echo "No source changes to submit."
            exit 0
          fi
          git commit -m "fix: AI Guardian automated website maintenance"
          gh auth setup-git
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "AI Guardian: guarded website fix" --body "## Automated maintenance proposal

          This pull request was generated by the scheduled AI Website Guardian.

          - Production pages were checked with Playwright on desktop and mobile.
          - Gemini proposed a minimal change limited to approved public UI files.
          - The generated change passed the project build and post-fix browser audit.
          - No order, payment, authentication, admin, database, environment, or design/content configuration files were modified.

          Please review the Vercel Preview before merging.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Publish report to Admin Dashboard
        if: always() && steps.audit.outcome == 'success'
        env:
          AI_GUARDIAN_INGEST_URL: https://ccowyndqzlkpilygpepx.supabase.co/functions/v1/ai-guardian-report
          AI_GUARDIAN_INGEST_SECRET: ${{ secrets.AI_GUARDIAN_INGEST_SECRET }}
          AI_GUARDIAN_REPORT_FILE: ${{ steps.compare.outputs.safe == 'true' && 'ai-guardian-postfix.json' || 'ai-guardian-report.json' }}
          AI_GUARDIAN_PR_URL: ${{ steps.create_pr.outputs.url }}
          AI_GUARDIAN_FIX_BRANCH: ${{ steps.create_pr.outputs.branch }}
          AI_GUARDIAN_FIX_STATUS: ${{ steps.create_pr.outputs.url != '' && 'pr_created' || (steps.create_pr.outcome == 'failure' && 'failed') || (steps.validate.outcome == 'failure' && 'failed') || (steps.compare.outcome == 'failure' && 'failed') || steps.ai_fix.outputs.fix_status || 'not_attempted' }}
        run: node scripts/ai-guardian-publish.mjs

      - name: Send instant email alert for detected issues
        if: always() && steps.audit.outcome == 'success'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AI_GUARDIAN_ALERT_TO: ${{ vars.AI_GUARDIAN_ALERT_TO }}
          AI_GUARDIAN_ALERT_FROM: ${{ vars.AI_GUARDIAN_ALERT_FROM }}
        run: node scripts/ai-guardian-alert.mjs

      - name: Add summary to GitHub run
        if: always() && steps.audit.outcome == 'success'
        run: |
          echo "## AI Website Guardian" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ai-guardian-report.json ]; then
            node -e "const r=require('./ai-guardian-report.json'); console.log('Health score:',r.health_score); console.log('Findings:',r.findings.length); console.log(r.summary)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.create_pr.outputs.url }}" ]; then
            echo "AI fix PR: ${{ steps.create_pr.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail run when Guardian detects blocking issues
        if: always() && steps.audit.outcome == 'success'
        env:
          INITIAL_BUILD_OUTCOME: ${{ steps.initial_build.outcome }}
          AI_FIX_STATUS: ${{ steps.ai_fix.outputs.fix_status }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('ai-guardian-report.json', 'utf8'));
          const problems = [];
          if (process.env.INITIAL_BUILD_OUTCOME !== 'success') problems.push('Build or typecheck failed.');
          if (report.status !== 'completed') problems.push(`Audit status: ${report.status}; health score: ${report.health_score}.`);
          if (report.metrics?.checkout_test?.status !== 'passed') problems.push('Checkout smoke test did not pass on both devices.');
          if (report.findings?.length && process.env.AI_FIX_STATUS === 'failed') problems.push('Gemini safe-fix attempt failed while findings were present.');
          if (problems.length) {
            console.error('AI Website Guardian found blocking issues:');
            for (const problem of problems) console.error(`- ${problem}`);
            process.exit(1);
          }
          console.log('Guardian audit, checkout smoke tests, build, and safe-fix status are healthy.');
          NODE
